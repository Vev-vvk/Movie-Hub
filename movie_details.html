<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieHub | Movie Details</title>

    <!-- NEW: Same shared stylesheet as index.html. -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- NEW: Top navigation is optional but keeps both pages visually connected. -->
    <header>
        <div class="flex">
            <div>
                <h1>Movie<span>Hub</span></h1>
            </div>
            <div id="hamburger" role="button" tabindex="0" aria-label="Open menu">
                <p>SYMBOL</p>
            </div>
        </div>

        <div id="options" class="hidden">
            <!-- NEW: These can later be converted into real navigation links. -->
            <p><a href="index.html">Home</a></p>
            <p>Menu</p>
            <p>Search</p>
        </div>
    </header>

    <!-- NEW: Back navigation instead of forcing the user to use browser back. -->
    <div class="detail-topbar">
        <a class="back-link" href="index.html">Back to MovieHub</a>
    </div>

    <h1>Movie Details</h1>

    <!-- IMPORTANT: Keep #movie-detail unchanged because movie_details.js fills this container. -->
    <div id="movie-detail"></div>

    <!-- NEW FEATURE IDEA:
         Your JS can add .detail-stats inside #movie-detail for Year, Rating,
         Runtime and Genre. The shared CSS already styles those classes.

         Example structure for movie_details.js:
         <div class="detail-stats">
             <div class="detail-stat"><small>Year</small><span>2026</span></div>
             <div class="detail-stat"><small>Rating</small><span>8.4</span></div>
             <div class="detail-stat"><small>Runtime</small><span>132 min</span></div>
             <div class="detail-stat"><small>Genre</small><span>Drama</span></div>
         </div>
    -->

    <!-- NEW: Optional footer. -->
    <footer class="site-footer">
        MovieHub · Movie details
    </footer>

    <script src="movie_details.js"></script>
</body>

</html>
